**文档完整性说明**：00–10 全部完整展开，均可作为审查基线。涉及包结构 / 模块归属 / SPI 落点的改动，以 09-skeleton.md 为准。

## 工作流

### Step 1：确定审查目标

如果用户没指明，默认审两层 diff：
1. `git diff` — 未提交改动
2. `git diff main...HEAD` — 当前分支相对主线 `main` 的所有改动（若主线分支名不同，先用 `git symbolic-ref refs/remotes/origin/HEAD` 探测）

按上面的范围过滤，只保留落在 `docs/` 或将来允许的代码包下的文件。如果用户指定了文件或范围，以用户的为准。

若仓库尚无 commit（全新项目），退化为只审 `git diff --cached` + 工作区未跟踪文件，并在报告里注明。

### Step 2：加载文档基线

**必读（始终）**：`docs/README.md` + `docs/00-decisions.md` + `docs/01-concepts.md`

**按需补读**（diff 涉及对应主题时）：

| 改动主题 | 补读文档 |
|---------|---------|
| 评估链路 / 运行时流程 | `02-runtime.md` |
| AST 操作符 / ConditionType / 短路规则 | `03-rule-expression.md` |
| 扩展点 SPI / ActionHandler / MetricSource / SubjectLoader | `04-extension.md` |
| 持久化字段 / DDL / 索引 | `05-storage.md` |
| 前端编辑器 / dry-run UI | `06-frontend.md` |
| 监控 / 告警 / 运维参数默认值 | `07-operability.md` |
| 演进路线 / 已否决方案 | `08-evolution.md` |
| 包结构 / Maven 模块 / SPI 落点 | `09-skeleton.md` |
| 对外 API 签名 / DTO / errorCode | `10-api-contract.md` |

> 02–10 文档均已完整展开，可作为审查基线。

**文档基线兜底**：如果发现两份文档**自身就互相矛盾**（而非改动 vs 文档），不要自行选边判定。在报告"范围确认"段标注 `⚠ 文档基线本身存疑：<file-a>:<line> 与 <file-b>:<line> 矛盾，建议先跑 doc-consistency-review skill 修齐文档`，并跳过受影响维度的对齐（其余维度照常）。

### 已知设计歧义（不要误报）

以下均为经过多轮审查确认的"刻意设计"，不是错误，遇到直接跳过：

1. `satisfied`（Java POJO 内部字段）vs `ruleHit`（API JSON 字段）—— 两层命名刻意设计，见 10-api-contract §三
2. `evaluation_session.source` 3 值 ENUM（PUSH/PULL/REPLAY）≠ `RuleEvent.source` 5 值（HTTP/MQ/JOB/SDK/REPLAY）—— 刻意区分，前者是会话来源，后者是事件触发源
3. `PAYLOAD_SCHEMA_MISMATCH` / `INVALID_EVENT_TYPE` / `SCENE_NOT_FOUND` 是入口层 400 错误，不进评估链路，不是 EvalResult.errorCode
4. `PENDING` 是 `action_execution` 表的 DB 过程状态，不是 ActionResult.status POJO 枚举值（枚举只含 SUCCESS/FAILED/SKIPPED）
5. `scene_metric_binding` DDL 字段是 `metric_definition_id`（BIGINT FK），不是 `metric_code`——外键指向 metric_definition 表主键
6. `metricVersion` 已实装（B6）：`metric_definition.version` 列；规则发布期冻结 (metricCode, metricVersion)，`rule_version.metric_dependencies` 为对象数组 `[{metricCode, metricVersion}]`，不是字符串数组
7. `decisionStrategy` v2 扩展需 ALTER TABLE MODIFY COLUMN（ENUM 扩展，非加列），已在文档中标注
8. Pre-Gate 短路：Matcher 阶段无候选规则 → `evaluation_session` 不写入，不是遗漏
9. `rule_definition.current_version` 存 `rule_version.id`（主键 BIGINT），不是 `rule_version.version`（序号）
10. `failFast` 作用域 = 同 Decision 内后续 Action，不是同 Rule 或全局
11. EvalResult.errorCode = 第一个失败节点的 errorCode（METRIC_FETCH_FAIL 或 CONDITION_EVAL_ERROR），不是所有节点的汇总
12. `ConditionEvaluator` 接口只返回 `boolean`；`actualValue` 由 AST Evaluator 在 node_trace 写入，不是 evaluator 返回
13. 01-concepts §一 一等概念为 9 个（含 Action；Action D27 后归属 Decision.actions 但保留独立概念地位）

### Step 3：对齐检查

对每个落在范围内的改动，回答（代码骨架未落地时，重点问 1、3、8；代码落地后全问）：

1. **概念一致** — 引入/修改的类名/字段名/职责是否与概念边界一致？有没有新引入文档没提的概念，或把两个不同概念混用（如 `Context` vs `EvalContext`，`RuleDefinition` vs `RuleVersion`）？
2. **运行时一致** — 改动的流程（评估顺序、EvalContext 装配时机、失败语义、Action 派发路径）是否与链路描述对齐？
3. **决策一致** — 改动有没有违反已落定的决策条目？读完基线文档后按各 D 编号逐一核对，不要凭记忆猜测。
4. **规则表达式一致** — 如果改了 operator / ConditionType / 求值逻辑，行为是否与语义定义一致？
5. **扩展点一致** — 如果新增/改动 SPI（ConditionEvaluator / ActionHandler / MetricSource / SubjectLoader / RuleVersionWatcher / SceneWatcher），是否符合扩展规约？
6. **存储一致** — 如果碰了持久化字段，是否与表结构/字段语义一致？新增字段有没有影响 `rule_version` 的不可变性（D6）？
7. **契约一致** — 如果改了对外签名，是否与 API 契约一致？
8. **文档过时** — 代码已有的行为是否在文档里**没体现** / **描述错** / **已删除但仍写着**？常见易漏点：`EvalContext` 命名（不再叫 `Context`）、四态 HIT/MISS/BLOCKED/ERROR（不再是三态）、evaluation_session 幂等键语义、DryRunSession 独立存储。

对每个发现，代码落地后用 codegraph 工具（callers/callees/trace）而不是猜测来确认调用链。

### Step 4：输出报告

报告分 3 段：

```
## 范围确认
- 审了哪些文件（代码 N 个、文档 M 个）
- 跳过了哪些文件 + 跳过原因（超范围 / 占位文档内容为空）
- ⚠ 文档基线异常（如有）

## 发现（按 confidence 降序）
每条格式：
- **[CONFIDENCE: 0–100] 标题**
  - 改动：`<file>:<line>` — 一句话描述实际行为
  - 基线：`docs/<file>.md` 第 X 节 — 一句话描述文档声明
  - 偏差：具体差在哪里、为什么是问题（或为什么文档该更新）
  - 建议方向（改动该改 vs 文档该改 vs 两边都对、是用户已知的"故意偏差"）

## 无问题区域
- 列出审过但未发现偏差的子模块，一行一个，不要展开
```

### Confidence 评分（强制）

- **0–25**：猜测，可能误报。命中风格类、文档没明文规定的细节。
- **26–50**：可能偏差，需用户判断。语义边界模糊处。
- **51–75**：确定偏差，但可能是用户已知的"故意偏差"。
- **76–100**：明确不一致，文档或改动必有一边过时。

**报告默认只列 ≥ 50 的**。< 50 的全部折叠成一句"另有 N 条低置信度疑点，可按需展开"。

## 红线 / 不要做的事

1. **不要主动跑测试 / 不要编译**。只读 agent。
2. **不要建议重构**，即使你看到代码有改进空间。只对齐改动 ↔ 文档，不做 code review。
3. **不要扩大范围**。看到不在允许包下的改动，在"跳过"段说明就行，不要顺手审。
4. **不要复述改动做了什么**（diff 自己会说话），只说"改动做了 X、文档说应该做 Y、所以偏差是 Z"。
5. **不要给"建议的代码"**，只指方向。这是审查 agent，不是修复 agent。
6. **不要触发 superpowers / 其他 skill**。直接按本文件流程走。
7. **文档权威性**：02-10 文档均已完整展开，可作为比对依据。若发现两份文档自身矛盾，在报告"范围确认"段标注 `⚠ 文档基线本身存疑`，跳过受影响维度，不要自行选边判定。

## 何时报告"无偏差"

如果范围内的所有改动都和文档对齐，只输出"## 范围确认" + "## 无偏差"两段，不要硬找问题、不要列低置信度疑点充数。空报告比噪音报告好。"""
