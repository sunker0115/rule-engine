spring:
  application:
    name: rule-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rule_engine?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  modulith:
    events:
      republish-outstanding-events-on-restart: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    export:
      prometheus:
        enabled: true
  opentelemetry:
    metrics:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  tracing:
    sampling:
      probability: 1.0

engine:
  rule:
    matcher:
      cache-refresh-interval-seconds: 30
    scene:
      watch-interval-seconds: 60
    idempotency:
      redis-ttl-seconds: 86400
    trace:
      enabled: true
      queue-capacity: 10000
      batch-size: 500
      flush-interval-ms: 200
      consumer-threads: 2
    metric:
      default-cache-ttl-seconds: 60
    action:
      default-timeout-ms: 3000
    retention:
      evaluation-session-days: 90
      node-trace-days: 30
      dry-run-session-days: 7
    rollout:
      hash-seed: 42
    observability:
      eval-error-rate-threshold: 0.05
      trace-queue-full-threshold: 0.8

