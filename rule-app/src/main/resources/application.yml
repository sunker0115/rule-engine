spring:
  application:
    name: rule-engine
  autoconfigure:
    # OTel SDK 已通过 management.opentelemetry.* 推送 OTLP 指标；排除 Micrometer 的 OTLP registry
    # 避免其 protobuf 4.26.1 与 OTel SDK 4.32.0 版本冲突导致 NPE
    exclude: org.springframework.boot.micrometer.metrics.autoconfigure.export.otlp.OtlpMetricsExportAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rule_engine?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  modulith:
    events:
      republish-outstanding-events-on-restart: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 实体 status 等 Java enum 字段按 name() 与 varchar 列往返（枚举名 == DB 值）
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    export:
      prometheus:
        enabled: true
  opentelemetry:
    metrics:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  tracing:
    sampling:
      probability: 1.0

engine:
  rule:
    # SDK 模式快照轮询间隔走 rule.sdk.poll-interval（独立前缀，不在 engine.rule.* 下）；服务端索引为事件驱动，无定时刷新键
    eval:
      compiled-executor:
        enabled: false           # 编译执行器灰度开关；false=全部走解释器(默认，与解释器逐字节一致)
        rule-code-whitelist: []  # enabled 且为空=全量编译；非空=仅列出的 code 走编译
        on-compile-error: FALLBACK  # FALLBACK=WARN+回落解释器；FAIL=抛异常中止
    trace:
      enabled: true
      queue-capacity: 10000
      batch-size: 500        # 每次 drain 最多落库条数
      flush-interval-ms: 200 # 消费线程刷库间隔（毫秒）
      # TraceWriter 单虚拟线程批量落库；提吞吐调 batch-size/flush-interval-ms（旁路通道满则丢，不阻塞热路径）
    metric:
      default-cache-ttl-seconds: 60   # metric 取数缓存默认 TTL(秒);建 metric 未指定 cacheTtlSeconds 时取此值,各 metric 可单独定制覆盖
    script:
      precompile:
        mode: LAZY   # EXPRESSION_SCRIPT 脚本编译加热: LAZY=首次评估编译(默认); EAGER=快照加载期(启动/发布热更/场景变更)预编译
    # 调度后端选型，经环境变量 ENGINE_RULE_JOB_SCHEDULER 覆盖：
    #   in-process — 进程内 ThreadPool 单机调度（适合本地开发/无外部依赖）
    #   xxl-job    — XXL-JOB 分布式调度（需起 XXL admin + 配下方 xxl.* 连接信息，
    #                支持集群单派发 + 分片广播；config→eval 跨实例广播依赖此模式）
    job:
      scheduler: ${ENGINE_RULE_JOB_SCHEDULER:in-process}
      # 仅 scheduler=xxl-job 时生效；敏感项走环境变量不入库不硬编码
      xxl:
        admin-addresses: ${XXL_ADMIN_ADDRESSES:http://127.0.0.1:8088}
        appname: ${XXL_APPNAME:rule-engine}
        port: ${XXL_EXECUTOR_PORT:9999}
        log-path: ${XXL_LOG_PATH:/tmp/xxl-job-logs}
        access-token: ${XXL_ACCESS_TOKEN:default_token}
        admin-username: ${XXL_ADMIN_USERNAME:admin}
        admin-password: ${XXL_ADMIN_PASSWORD:123456}
    # 数据保留/清理:各模块 @Scheduled 按保留窗删超期运行/历史行(observability 清 trace 两表、eval-svc 清 session 两表)
    retention:
      enabled: true
      cron: "0 30 3 * * *"       # 每日 03:30
      batch-size: 1000           # 单批删除上限(分批短事务)
      evaluation-session-days: 90
      node-trace-days: 30
    # 告警阈值:ObservabilityAlarmChecker @Scheduled 读 MeterRegistry,超阈值发 EvalAlarmEvent(打 WARN 日志)
    observability:
      eval-error-rate-threshold: 0.05
      trace-queue-full-threshold: 0.8

